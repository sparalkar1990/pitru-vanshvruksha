function openAdd(){state.editing={id:null,source:state.source==='all'?'यादी २':state.source,rel:'',name:'',gotra:'',cat:'father'};state.showModal=true;render();}
function openEdit(id){const p=state.people.find(x=>x.id===id);state.editing={...p};state.showModal=true;render();}
function renderModal(){const p=state.editing;document.getElementById('modal-root').innerHTML=`<div class="modal"><div class="modal-card"><div class="modal-head"><div><div class="panel-title">${p.id?'नोंद संपादित करा':'नवीन व्यक्ती जोडा'}</div><div class="panel-sub">तुमची माहिती या ब्राउझरमध्ये साठवली जाईल</div></div><button class="round" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>नाव</label><input id="f-name" value="${esc(p.name)}" placeholder="उदा. सीताराम"></div><div class="field"><label>गोत्र</label><input id="f-gotra" value="${esc(p.gotra)}" placeholder="उदा. काश्यप"></div><div class="field full"><label>पितरांचा क्रम / नाते</label><input id="f-rel" value="${esc(p.rel)}" placeholder="उदा. पितामह - आजोबा"></div><div class="field"><label>वर्ग</label><select id="f-cat"><option value="father" ${p.cat==='father'?'selected':''}>👨 पितृ पक्ष</option><option value="mother" ${p.cat==='mother'?'selected':''}>👩 मातृ पक्ष</option><option value="guru" ${p.cat==='guru'?'selected':''}>🕉 गुरु परंपरा</option><option value="other" ${p.cat==='other'?'selected':''}>◎ इतर</option></select></div><div class="field"><label>यादी / स्रोत</label><select id="f-source"><option ${p.source==='यादी १'?'selected':''}>यादी १</option><option ${p.source==='यादी २'?'selected':''}>यादी २</option><option>नवीन</option></select></div></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">रद्द</button><button class="primary" onclick="savePerson()">💾 जतन करा</button></div></div></div></div>`;}
function savePerson(){const data={...state.editing,name:document.getElementById('f-name').value.trim(),gotra:document.getElementById('f-gotra').value.trim(),rel:document.getElementById('f-rel').value.trim(),cat:document.getElementById('f-cat').value,source:document.getElementById('f-source').value||'नवीन'};if(!data.rel){alert('नाते / क्रम भरा');return;}if(data.id){const i=state.people.findIndex(x=>x.id===data.id);state.people[i]=data;}else{data.id='n'+Date.now();state.people.push(data);}save();state.showModal=false;state.toast='नोंद जतन झाली ✓';render();showToast();}
function askDelete(id){const p=state.people.find(x=>x.id===id);if(!p)return;if(confirm(`“${p.name||p.rel}” ही नोंद काढायची आहे का?`)){state.people=state.people.filter(x=>x.id!==id);save();state.toast='नोंद काढली ✓';render();showToast();}}
function closeModal(){state.showModal=false;render();}
function setFilter(v){state.filter=v;render();}
function setSource(v){state.source=v;render();}
function setTheme(){const themes=[
  ['#08111f','#101a2c','#7dd3fc'],['#19100c','#25150f','#f6c453'],['#0a1614','#10241d','#58d6a4'],['#15111f','#1e162c','#d98cff']
];let i=Number(localStorage.getItem('pitru-theme')||0);i=(i+1)%themes.length;localStorage.setItem('pitru-theme',i);const t=themes[i];document.documentElement.style.setProperty('--bg',t[0]);document.documentElement.style.setProperty('--bg2',t[1]);document.documentElement.style.setProperty('--accent',t[2]);state.toast='रंग थीम बदलली ✨';render();showToast();}
function resetData(){if(confirm('मूळ Excel मधील नोंदी परत आणायच्या आहेत का?')){state.people=initialPeople.map(x=>({...x}));save();state.toast='मूळ डेटा परत आणला ✓';render();showToast();}}
const englishNameMap={'प्रसन्न':'Prasanna','सीताराम':'Sitaram','अनंताचार्य':'Anantacharya','भारती':'Bharti','इंदिरा':'Indira','मोहन':'Mohan','शंकर':'Shankar','दामोदर':'Damodar','गंगूबाई':'Gangubai','मिलिंद':'Milind','बाबाचार्य पुरोहित':'Babacharya Purohit','सत्यप्रमोदतीर्थ':'Satyapramodateertha','नारायणाचार्य':'Narayanacharya','लक्ष्मी':'Lakshmi','रघुनाथ रामकृष्ण':'Raghunath Ramkrishna','य. रघुनाथ':'Y. Raghunath','भवानराव':'Bhavanrao','रखुमाबाई':'Rakhumabai','जानकी':'Janaki','रंगूताई':'Rangutai','दत्तात्रय':'Dattatraya','सावित्री':'Savitri','दमयंती':'Damyanti','माधवाचार्य':'Madhavacharya','अंबा सीताराम':'Amba Sitaram','बाळकृष्ण पुरोहित':'Balkrishna Purohit'};
const devConsonants={'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ng','च':'ch','छ':'chh','ज':'j','झ':'jh','ञ':'ny','ट':'t','ठ':'th','ड':'d','ढ':'dh','ण':'n','त':'t','थ':'th','द':'d','ध':'dh','न':'n','प':'p','फ':'ph','ब':'b','भ':'bh','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'sh','ष':'sh','स':'s','ह':'h','ळ':'l'};
const devMatras={'ा':'a','ि':'i','ी':'i','ु':'u','ू':'u','ृ':'ri','े':'e','ै':'ai','ो':'o','ौ':'au','ॅ':'e','ॉ':'o'};
const devVowels={'अ':'a','आ':'aa','इ':'i','ई':'i','उ':'u','ऊ':'u','ऋ':'ri','ए':'e','ऐ':'ai','ओ':'o','औ':'au'};
function transliterateDevanagari(text){let out='';let lastConsonant=false;for(const ch of String(text||'')){if(devConsonants[ch]){out+=devConsonants[ch]+'a';lastConsonant=true;continue;}if(ch==='्'){if(lastConsonant&&out.endsWith('a'))out=out.slice(0,-1);lastConsonant=false;continue;}if(devMatras[ch]){if(lastConsonant&&out.endsWith('a'))out=out.slice(0,-1);out+=devMatras[ch];lastConsonant=false;continue;}if(devVowels[ch]){out+=devVowels[ch];lastConsonant=false;continue;}if(ch==='ं'||ch==='ँ'){out+='n';lastConsonant=false;continue;}if(ch==='ः'){out+='h';lastConsonant=false;continue;}if(ch==='़'){continue;}out+=ch;lastConsonant=false;}return out.replace(/aa/g,'a').replace(/ii/g,'i').replace(/uu/g,'u').replace(/([a-z])\1a/g,'$1$1');}
function localizeName(name){if(state.language!=='en')return name;if(englishNameMap[name])return englishNameMap[name];const value=transliterateDevanagari(name);return /[\u0900-\u097F]/.test(value)?name:value;}
let nameLocalizationFrame=null;
function translateNamesInView(){if(nameLocalizationFrame!==null)cancelAnimationFrame(nameLocalizationFrame);nameLocalizationFrame=requestAnimationFrame(()=>{nameLocalizationFrame=null;document.querySelectorAll('.card h3,.node strong').forEach(el=>{const original=el.dataset.originalName||el.textContent;el.dataset.originalName=original;el.textContent=localizeName(original);});});}
function startNameLocalization(){const observer=new MutationObserver(()=>translateNamesInView());observer.observe(document.getElementById('app'),{childList:true,subtree:true});translateNamesInView();}
function showToast(){setTimeout(()=>document.getElementById('toast')?.classList.add('show'),30);setTimeout(()=>document.getElementById('toast')?.classList.remove('show'),1900)}
render();
updateInstallButton();
startNameLocalization();
</script>
